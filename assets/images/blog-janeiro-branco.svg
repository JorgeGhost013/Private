<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" fill="none">
  <defs>
    <linearGradient id="bgJaneiro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E372B"/>
      <stop offset="60%" stop-color="#162B21"/>
      <stop offset="100%" stop-color="#0E1D16"/>
    </linearGradient>
    <linearGradient id="whiteRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#EDEDED"/>
      <stop offset="100%" stop-color="#CFCFCF"/>
    </linearGradient>
    <linearGradient id="goldJaneiro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF98"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bgJaneiro)"/>

  <!-- Subtle heartbeat / pulse line -->
  <path d="M40 190 L160 190 L180 150 L200 230 L220 170 L240 210 L260 190 L560 190" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" fill="none"/>

  <!-- Central Composition -->
  <g transform="translate(180, 50)">
    <!-- Aura of mental health and care -->
    <circle cx="120" cy="110" r="110" fill="#FFFFFF" opacity="0.04" filter="blur(20px)"/>

    <!-- White Awareness Ribbon (Janeiro Branco) -->
    <path d="M120 70 C90 20, 45 45, 60 95 C75 145, 120 180, 120 180 C120 180, 165 145, 180 95 C195 45, 150 20, 120 70 Z" fill="none" stroke="url(#whiteRibbon)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Ribbon tails -->
    <path d="M85 155 L45 220 L75 225 L105 175" fill="url(#whiteRibbon)"/>
    <path d="M155 155 L195 220 L165 225 L135 175" fill="url(#whiteRibbon)"/>

    <!-- Nursing Cross with golden heart emblem -->
    <g transform="translate(95, 75)">
      <rect x="15" y="0" width="20" height="50" rx="4" fill="#2A4B3D" stroke="url(#goldJaneiro)" stroke-width="2"/>
      <rect x="0" y="15" width="50" height="20" rx="4" fill="#2A4B3D" stroke="url(#goldJaneiro)" stroke-width="2"/>
      <!-- Heart in center -->
      <path d="M25 21 C23 18, 19 18, 19 23 C19 28, 25 32, 25 32 C25 32, 31 28, 31 23 C31 18, 27 18, 25 21 Z" fill="url(#goldJaneiro)"/>
    </g>
  </g>

  <!-- Info Card Below -->
  <g transform="translate(140, 230)">
    <rect x="0" y="0" width="320" height="110" rx="14" fill="#14261E" stroke="url(#goldJaneiro)" stroke-width="1.5"/>
    <text x="160" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="2">
      SAÚDE DO TRABALHADOR
    </text>
    <text x="160" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#E2C799">
      Enfermagem &amp; Burnout Ocupacional
    </text>
    <text x="160" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#A8BCB1">
      Plantões 12x36 • Estabilidade INSS • Insalubridade
    </text>
    <text x="160" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#FFFFFF" opacity="0.85">
      Proteção legal e direitos da categoria
    </text>
  </g>
</svg>
